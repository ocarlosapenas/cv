# Broken links in cv.yaml and inside the rendered PDFs. The only job with network
# access (tools/run --net lychee). Weekly, and as a non-blocking check on PRs that
# change cv.yaml.
name: links

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [cv.yaml]

permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the toolchain image
        run: tools/build.sh

      - name: Render every variant
        run: make build

      - name: Check the links
        run: make links
