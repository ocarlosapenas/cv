      Backend and DevOps engineer with 15 years in production systems, working remotely from Brazil with U.S. teams.

      Today I run the backend services, AWS infrastructure and weekly multi-repository release train for a U.S. adtech platform that serves 20M+ pageviews per day. Recent work: a VPS-to-AWS migration that moved a 250 GB database with under 2 hours of downtime, an AWS spend cut of about 25%, an org-wide CI quality gate, and post-deploy verification with automatic rollback.

      What I do best is root cause analysis that ends in prevention: I debug to the actual cause, prove it is neutralized, and add the check or alert that keeps it from coming back.

      I also direct coding agents on real brownfield code: Claude Code skills, MCP tooling and multi-agent workflows with adversarial review, where agent output stays a hypothesis until tests, logs and runtime data confirm it.

      Stack: PHP, Laravel, MySQL/MariaDB, Redis, AWS (EC2, RDS, ElastiCache, Lambda, S3, SQS, SNS), Linux, Docker, GitHub Actions, OpenTofu, Ansible, Vue.js.

work:
  - name: AdMetricsPro
    position:
      default: Senior Backend Engineer
      fde: Senior Backend and Infrastructure Engineer
    location:
      default: Remote, U.S. company
      linkedin: United States
    employmentType: Full-time
    # LinkedIn shows the role as two positions: this one (full-time, from Jun 2024)
    # and the contract period below, tagged linkedin only.
    startDate:
      default: "2023-07"
      linkedin: "2024-06"
    summary: >-
      Backend services, AWS infrastructure and releases for a U.S. programmatic advertising
      platform. Contractor through Proxify from Jul 2023; hired directly as a full-time
      employee in Jun 2024.
    stack:
      - PHP
      - Laravel
      - Lumen
      - REST APIs
      - MySQL
      - MariaDB
      - SQL
      - Redis
      - AWS
      - AWS EC2
      - AWS RDS
      - AWS S3
      - AWS SQS
      - AWS SNS
      - AWS Lambda
      - AWS ElastiCache
      - Linux
      - Bash
      - Docker
      - Git
      - GitHub Actions
      - CI/CD
      - Cloudflare
      - Vue.js
      - JavaScript
      - HTML
      - CSS
      - PHPUnit
      - {name: OAuth2, startDate: "2026-08", note: Laravel Passport upgrade is the first evidence}
      - {name: Stripe, startDate: "2026-06", note: first evidence in session notes}
      - {name: Infection, startDate: "2026-06"}
      - {name: PHPMD, startDate: "2026-06"}
      - {name: Deptrac, startDate: "2026-06"}
      - {name: PHPStan, startDate: "2026-08"}
      - {name: Renovate, startDate: "2026-09"}
      - {name: Claude Code, startDate: "2026-05", note: first evidence in session notes}
      - {name: MCP, startDate: "2026-05", note: first evidence in session notes}
      - {name: Cursor, startDate: "2026-10", note: first evidence in the 2026-10-15 CV}
    highlights:
      - Led the move from a VPS to AWS (EC2, RDS, ALB, ACM), including a 250 GB MariaDB migration with under 2 hours of downtime.
      - Build and operate PHP/Laravel APIs and queue-driven ingestion services on AWS that handle 20M+ pageviews per day.
      - text: Coordinate the weekly release train across 7 interconnected repositories with GitHub Actions; added post-deploy verification with automatic rollback and shipped 7 production deploys in under 14 minutes with zero rollbacks.
      - text: Root-caused 30,000 failed jobs spread across 7 apps, 3 databases and 5 error classes, and found a database lock that a self-healing cron had hidden for months.
      - text: Traced a multi-tenant isolation bug across 4 hops and 3 repositories.
        tags: [backend, fde]
      - text: Cut AWS spend by about 25% with right-sizing, RDS Reserved Instances and Compute Savings Plans.
        tags: [backend, fde, linkedin]
      - text: Upgraded core services to Laravel 13 and Passport 13 with zero ERROR or CRITICAL logs after release, and migrated ElastiCache from Redis 6.2 to Valkey 8.2 in production in 12 minutes.
        tags: [backend]
      - text: Built data-freshness alerting for the ingestion pipeline, daily infrastructure drift checks and AWS budget alerts.
        tags: [backend, fde, linkedin]
      - text: Created an org-wide GitHub Actions quality gate (Infection mutation testing, PHPStan, PHPMD, Deptrac) and raised a mutation score from 69% to 93% as an acceptance criterion.
        tags: [backend, linkedin]
      - text: Integrated Stripe billing, led the PCI DSS SAQ A remediation through confirmation by moving card entry to Stripe's Payment Element with a per-tenant canary rollout, and closed 26 of 29 dependency security advisories with self-hosted Renovate.
        tags: [backend, fde]
      - text: Built Claude Code skills (some over 1,000 lines) and MCP-based tooling used for branch creation, the weekly release train and the dependency security cycle.
        tags: [ai, fde, linkedin]
      - text: Run multi-agent workflows on legacy multi-repository code with worktree-per-epic isolation, adversarial review by a fresh agent and a triple-evidence rule; with one coordinating session dispatching approval-gated agent sessions, led a payments compliance epic across several repositories to production in three weeks.
        tags: [ai, linkedin]
      - text: Analyzed agent failures (fabricated output, out-of-scope actions, silent scheduled-task failures) and turned each one into a guardrail.
        tags: [ai]

