# Single source of truth for the CV. Schema: schemas/cv.schema.json.
#
# PHASE 2 (2026-10-16): content confirmed by the owner. A new claim marked
# `status: verify` still needs the owner's confirmation; releases are blocked while
# any remain (Phase 3).
#
# Conventions
# - Field names follow JSON Resume (https://jsonresume.org/schema).
# - A value can differ per variant: {default: ..., ai: ..., fde: ...}.
# - `tags: [ai, fde]` limits an entry or bullet to those variants; no tags = all.
# - No phone or street address here, ever: see CONFIDENTIALITY.md.

meta:
  variants:
    backend:
      sections: [summary, skills, work, projects, volunteer, education, certificates, languages]
      max_pages: 2
    ai:
      sections: [summary, work, skills, projects, volunteer, education, certificates, languages]
      max_pages: 2
    fde:
      sections: [summary, work, projects, volunteer, skills, education, certificates, languages]
      max_pages: 2
    # Not a PDF: source of the paste-ready LinkedIn texts (make linkedin).
    linkedin:
      sections: [summary, work, projects, volunteer, skills, education, certificates, languages]

