# Single source of truth for the CV. Schema: schemas/cv.schema.json.
#
# PHASE 1 PLACEHOLDER: every person, company and number below is fictitious. Real
# content arrives in Phase 2, item by item, after review.
#
# Conventions
# - Field names follow JSON Resume (https://jsonresume.org/schema).
# - A value can differ per variant: {default: ..., ai: ..., fde: ...}.
# - `tags: [ai, fde]` limits an entry or bullet to those variants; no tags = all.
# - `status: verify` marks a claim that still needs confirmation; releases are blocked
#   while any remain (Phase 3).
# - No phone or street address here, ever: see CONFIDENTIALITY.md.

meta:
  variants:
    backend:
      sections: [summary, skills, work, projects, education, certificates, languages]
      max_pages: 2
    ai:
      sections: [summary, projects, work, skills, education, certificates, languages]
      max_pages: 2
    fde:
      sections: [summary, work, projects, skills, education, certificates, languages]
      max_pages: 2

