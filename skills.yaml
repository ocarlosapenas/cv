# Owner-confirmed totals ({years: N, as_of: YYYY-MM}) take precedence over the computed
# evidence when answering application questions. They are personal application data, so
# they live in the private overlay private/skills-private.yaml (gitignored), together
# with evidence from side projects. This public file keeps none.
confirmed: {}

# Evidence that is not on the CV itself.
evidence:
  - where: Career as a software developer (all roles on the CV)
    startDate: "2011-03"
    stack: [Software Development]
  - where: This repository (CV as code)
    startDate: "2026-10"
    stack:
      - name: Python
        note: Scripts and tests written by a coding agent under the owner's direction.
      - Typst
      - Docker
      - pytest

