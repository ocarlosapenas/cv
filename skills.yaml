# Skill tracking configuration, read by `make skills` and `make match`.
#
# Years of experience are NOT typed here: scripts/skills.py computes them from the
# `stack` of each entry in cv.yaml. This file only says how names map to each other,
# which extra terms to look for in job posts, and which totals the owner confirmed.

# Canonical name -> other names used in job posts and application questions.
aliases:
  REST APIs: [REST API, RESTful API, RESTful APIs, API, APIs, API Development, Web APIs]
  OpenAPI/Swagger: [OpenAPI, Swagger]
  Laravel: [Laravel Framework]
  PostgreSQL: [Postgres]
  MongoDB: [Mongo, NoSQL]
  Redis: [Valkey, Redis/Valkey]
  SQL: [Databases, Banco de dados, Relational databases]
  JavaScript: [JS]
  Vue.js: [Vue, VueJS]
  HTML: [HTML5]
  CSS: [CSS3, Cascading Style Sheets (CSS)]
  Bootstrap: [Bootstrap (Framework)]
  AWS: [Amazon Web Services, Amazon Web Services (AWS)]
  AWS EC2: [EC2, Amazon EC2]
  AWS RDS: [RDS, Amazon RDS, Amazon Relational Database Service (RDS)]
  AWS S3: [S3, Amazon S3]
  AWS SQS: [SQS, Amazon SQS]
  AWS SNS: [SNS, Amazon SNS]
  AWS Lambda: [Lambda]
  AWS ElastiCache: [ElastiCache, Amazon ElastiCache]
  Google Cloud: [GCP, Google Cloud Platform, Google Cloud Platform (GCP)]
  DigitalOcean: [Digital Ocean]
  Docker: [Docker Products, Docker Compose]
  Bash: [Shell, Shell scripting, Shell Script, Bash scripting]
  CI/CD: [Continuous Integration, Continuous Delivery, Continuous Integration and Continuous Delivery (CI/CD)]
  PHPUnit: [Unit Testing, Unit tests, Test Automation]
  Scrum: [Agile]
  Python: [Python (Programming Language)]
  MCP: [Model Context Protocol]
  Electron: [Electron (nodejs)]
  Lumen: [Laravel Lumen]
  Stripe: [Stripe (Software)]
  OAuth2: [OAuth, OAuth 2.0]
  Git: [GIT]
  Apache: [Apache HTTP Server, LAMP]
  MVC: [Model-View-Controller (MVC), Model View Controller]
  Software Development: [Programming, Back-End Web Development, Backend Development, Web Development, IT experience]

